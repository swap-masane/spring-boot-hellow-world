# Production profile - SQL Server configuration

# SQL Server datasource (use environment variables for security)
spring.datasource.url=${DB_URL:jdbc:sqlserver://prod-server:1433;databaseName=employee_reports;encrypt=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA/Hibernate for SQL Server
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Production report directory
report.base-directory=/var/reports/employee-department

# Production logging
logging.level.com.example.reports=WARN
logging.file.name=/var/logs/employee-department-report.log
