# Development profile - SQL Server configuration

# SQL Server datasource
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=employee_reports;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=YourStrong@Passw0rd
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA/Hibernate for SQL Server
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Development-specific report directory
report.base-directory=./reports
