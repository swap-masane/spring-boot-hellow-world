# Application name
spring.application.name=employee-department-report

# Server configuration
server.port=8080

# Report configuration
report.base-directory=/var/reports/employee-department
report.time-zone=Europe/Berlin
report.output-retention=7d
report.temp-folder=temp
report.output-folder=output
report.error-folder=error
report.archive-folder=archive

# Logging
logging.level.com.example.reports=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# JPA/Hibernate configuration
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
